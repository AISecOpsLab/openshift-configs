apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-proxy-01
  namespace: aisecops
  labels:
    app: srv-proxy-01
    role: load_balancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-proxy-01
  template:
    metadata:
      labels:
        app: srv-proxy-01
    spec:
      containers:
      - name: haproxy
        image: ubuntu:24.04
        command: ["sleep", "infinity"]
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: haproxy-config
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
      # Sidecar Wazuh : agent SOC, s'enrôle automatiquement aupres du manager.
      # Nom d'agent = hostname -> mappe agent.name sur target_host (contrat d'alerte).
      # Collecte des logs applicatifs + regles de detection ajoutees en Phase 3.
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-proxy-01
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: haproxy-config
        configMap:
          name: cm-srv-proxy-01-haproxy
---
apiVersion: v1
kind: Service
metadata:
  name: srv-proxy-01
  namespace: aisecops
spec:
  selector:
    app: srv-proxy-01
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
