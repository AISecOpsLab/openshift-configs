apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-db-01
  namespace: aisecops
  labels:
    app: srv-db-01
    role: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-db-01
  template:
    metadata:
      labels:
        app: srv-db-01
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: changeme
        - name: POSTGRES_DB
          value: appdb
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-db-01
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            cpu: 100m
            memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: srv-db-01
  namespace: aisecops
spec:
  selector:
    app: srv-db-01
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
