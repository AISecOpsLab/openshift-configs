apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-files-01
  namespace: aisecops
  labels:
    app: srv-files-01
    role: file_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-files-01
  template:
    metadata:
      labels:
        app: srv-files-01
    spec:
      containers:
      - name: samba
        image: ubuntu:24.04
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: samba-config
          mountPath: /etc/samba/smb.conf
          subPath: smb.conf
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
      # Sidecar Wazuh : agent SOC, s'enrôle automatiquement aupres du manager.
      # Nom d'agent = hostname -> mappe agent.name sur target_host (contrat d'alerte).
      # Collecte des logs applicatifs + regles de detection ajoutees en Phase 3.
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-files-01
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: samba-config
        configMap:
          name: cm-srv-files-01-samba
      - name: sshd-config
        configMap:
          name: cm-srv-files-01-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: srv-files-01
  namespace: aisecops
spec:
  selector:
    app: srv-files-01
  ports:
  - name: smb
    port: 445
    targetPort: 445
  - name: netbios-ssn
    port: 139
    targetPort: 139
