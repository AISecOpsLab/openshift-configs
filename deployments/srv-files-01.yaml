apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-files-01
  namespace: aisecops
  labels:
    app: srv-files-01
    role: file_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-files-01
  template:
    metadata:
      labels:
        app: srv-files-01
    spec:
      containers:
      - name: samba
        image: ubuntu:24.04
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: samba-config
          mountPath: /etc/samba/smb.conf
          subPath: smb.conf
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
      volumes:
      - name: samba-config
        configMap:
          name: cm-srv-files-01-samba
      - name: sshd-config
        configMap:
          name: cm-srv-files-01-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: srv-files-01
  namespace: aisecops
spec:
  selector:
    app: srv-files-01
  ports:
  - name: smb
    port: 445
    targetPort: 445
  - name: netbios-ssn
    port: 139
    targetPort: 139
