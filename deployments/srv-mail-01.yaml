apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-mail-01
  namespace: aisecops
  labels:
    app: srv-mail-01
    role: mail_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-mail-01
  template:
    metadata:
      labels:
        app: srv-mail-01
    spec:
      containers:
      - name: mail
        image: debian:12
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: postfix-config
          mountPath: /etc/postfix/main.cf
          subPath: main.cf
        - name: dovecot-config
          mountPath: /etc/dovecot/dovecot.conf
          subPath: dovecot.conf
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
      volumes:
      - name: postfix-config
        configMap:
          name: cm-srv-mail-01-postfix
      - name: dovecot-config
        configMap:
          name: cm-srv-mail-01-dovecot
      - name: sshd-config
        configMap:
          name: cm-srv-mail-01-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: srv-mail-01
  namespace: aisecops
spec:
  selector:
    app: srv-mail-01
  ports:
  - name: smtp
    port: 25
    targetPort: 25
  - name: submission
    port: 587
    targetPort: 587
  - name: imaps
    port: 993
    targetPort: 993
