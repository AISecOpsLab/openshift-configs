apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-mail-01
  namespace: aisecops
  labels:
    app: srv-mail-01
    role: mail_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-mail-01
  template:
    metadata:
      labels:
        app: srv-mail-01
    spec:
      containers:
      - name: mail
        image: debian:12
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: postfix-config
          mountPath: /etc/postfix/main.cf
          subPath: main.cf
        - name: dovecot-config
          mountPath: /etc/dovecot/dovecot.conf
          subPath: dovecot.conf
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-mail-01
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: postfix-config
        configMap:
          name: cm-srv-mail-01-postfix
      - name: dovecot-config
        configMap:
          name: cm-srv-mail-01-dovecot
      - name: sshd-config
        configMap:
          name: cm-srv-mail-01-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: srv-mail-01
  namespace: aisecops
spec:
  selector:
    app: srv-mail-01
  ports:
  - name: smtp
    port: 25
    targetPort: 25
  - name: submission
    port: 587
    targetPort: 587
  - name: imaps
    port: 993
    targetPort: 993
