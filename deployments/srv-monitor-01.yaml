apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-monitor-01
  namespace: aisecops
  labels:
    app: srv-monitor-01
    role: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-monitor-01
  template:
    metadata:
      labels:
        app: srv-monitor-01
    spec:
      containers:
      - name: monitoring
        image: rockylinux:9
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-monitor-01
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: prometheus-config
        configMap:
          name: cm-srv-monitor-01-prometheus
      - name: grafana-config
        configMap:
          name: cm-srv-monitor-01-grafana
      - name: sshd-config
        configMap:
          name: cm-srv-monitor-01-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: srv-monitor-01
  namespace: aisecops
spec:
  selector:
    app: srv-monitor-01
  ports:
  - name: prometheus
    port: 9090
    targetPort: 9090
  - name: grafana
    port: 3000
    targetPort: 3000
