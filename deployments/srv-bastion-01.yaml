apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-bastion-01
  namespace: aisecops
  labels:
    app: srv-bastion-01
    role: bastion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-bastion-01
  template:
    metadata:
      labels:
        app: srv-bastion-01
    spec:
      containers:
      - name: bastion
        image: ubuntu:24.04
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-bastion-01
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: sshd-config
        configMap:
          name: cm-srv-bastion-01-sshd
---
apiVersion: v1
kind: Service
metadata:
  name: srv-bastion-01
  namespace: aisecops
spec:
  selector:
    app: srv-bastion-01
  ports:
  - name: ssh
    port: 2222
    targetPort: 2222
