apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-bastion-01
  namespace: aisecops
  labels:
    app: srv-bastion-01
    role: bastion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-bastion-01
  template:
    metadata:
      labels:
        app: srv-bastion-01
    spec:
      containers:
      - name: bastion
        image: ubuntu:24.04
        #sshd
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq openssh-server rsyslog >/dev/null
            ssh-keygen -A
            useradd -m -s /bin/bash admin 2>/dev/null || true
            echo 'admin:supersecret' | chpasswd
            mkdir -p /run/sshd
            rsyslogd
            echo "sshd pret sur le port 2222 (config: /etc/ssh/sshd_config)"
            exec /usr/sbin/sshd -D
        ports:
        - containerPort: 2222
        volumeMounts:
        - name: sshd-config
          mountPath: /etc/ssh/sshd_config
          subPath: sshd_config
        - name: var-log
          mountPath: /var/log
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-bastion-01
        volumeMounts:
        - name: var-log
          mountPath: /var/log
          readOnly: true
        - name: wazuh-localfile
          mountPath: /entrypoint-scripts/10-aisecops-sshd-localfile.sh
          subPath: 10-aisecops-sshd-localfile.sh
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: sshd-config
        configMap:
          name: cm-srv-bastion-01-sshd
      - name: var-log
        emptyDir: {}
      - name: wazuh-localfile
        configMap:
          name: cm-wazuh-sshd-localfile
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: srv-bastion-01
  namespace: aisecops
spec:
  selector:
    app: srv-bastion-01
  ports:
  - name: ssh
    port: 2222
    targetPort: 2222
