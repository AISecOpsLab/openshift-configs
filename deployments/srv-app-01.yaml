apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-app-01
  namespace: aisecops
  labels:
    app: srv-app-01
    role: app_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-app-01
  template:
    metadata:
      labels:
        app: srv-app-01
    spec:
      containers:
      - name: apache
        image: httpd:2.4
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: apache-config
          mountPath: /usr/local/apache2/conf/extra/api-backend.conf
          subPath: api-backend.conf
      # Sidecar Wazuh : agent SOC, s'enrôle automatiquement aupres du manager.
      # Nom d'agent = hostname -> mappe agent.name sur target_host (contrat d'alerte).
      # Collecte des logs applicatifs + regles de detection ajoutees en Phase 3.
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-app-01
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: apache-config
        configMap:
          name: cm-srv-app-01-apache
---
apiVersion: v1
kind: Service
metadata:
  name: srv-app-01
  namespace: aisecops
spec:
  selector:
    app: srv-app-01
  ports:
  - name: api
    port: 8080
    targetPort: 8080
