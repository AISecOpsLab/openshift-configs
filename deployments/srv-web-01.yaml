apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-web-01
  namespace: aisecops
  labels:
    app: srv-web-01
    role: web_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-web-01
  template:
    metadata:
      labels:
        app: srv-web-01
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: nginx-logs
          mountPath: /var/log/nginx
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"   # mot de passe authd par défaut du lab (cf. openshift-infra/wazuh/secrets)
        - name: WAZUH_AGENT_NAME
          value: srv-web-01
        volumeMounts:
        # Lit le log d'acces nginx (volume partage).
        - name: nginx-logs
          mountPath: /var/log/nginx
          readOnly: true
        - name: wazuh-localfile
          mountPath: /entrypoint-scripts/10-aisecops-nginx-localfile.sh
          subPath: 10-aisecops-nginx-localfile.sh
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: nginx-config
        configMap:
          name: cm-srv-web-01-nginx
      - name: nginx-logs
        emptyDir: {}
      - name: wazuh-localfile
        configMap:
          name: cm-wazuh-nginx-localfile
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: srv-web-01
  namespace: aisecops
spec:
  selector:
    app: srv-web-01
  ports:
  - name: http
    port: 80
    targetPort: 80
