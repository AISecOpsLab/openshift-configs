apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-web-02
  namespace: aisecops
  labels:
    app: srv-web-02
    role: reverse_proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-web-02
  template:
    metadata:
      labels:
        app: srv-web-02
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-web-02
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            cpu: 100m
            memory: 384Mi
      volumes:
      - name: nginx-config
        configMap:
          name: cm-srv-web-02-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: srv-web-02
  namespace: aisecops
spec:
  selector:
    app: srv-web-02
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
