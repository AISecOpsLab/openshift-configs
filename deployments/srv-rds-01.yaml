apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-rds-01
  namespace: aisecops
  labels:
    app: srv-rds-01
    role: jump_host
    os: windows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-rds-01
  template:
    metadata:
      labels:
        app: srv-rds-01
    spec:
      containers:
      - name: windows-jump-sim
        image: ubuntu:24.04
        command: ["sleep", "infinity"]
        volumeMounts:
        - name: rdp-config
          mountPath: /etc/aisecops/rdp-policy.json
          subPath: rdp-policy.json
        - name: winrm-config
          mountPath: /etc/aisecops/winrm.conf
          subPath: winrm.conf
      - name: wazuh-agent
        image: wazuh/wazuh-agent:4.13.1
        env:
        - name: WAZUH_MANAGER_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_MANAGER_PORT
          value: "1514"
        - name: WAZUH_REGISTRATION_SERVER
          value: wazuh.wazuh.svc.cluster.local
        - name: WAZUH_REGISTRATION_PORT
          value: "1515"
        - name: WAZUH_REGISTRATION_PASSWORD
          value: "password"
        - name: WAZUH_AGENT_NAME
          value: srv-rds-01
        resources:
          requests:
            cpu: 25m
            memory: 192Mi
          limits:
            cpu: 100m
            memory: 384Mi
      volumes:
      - name: rdp-config
        configMap:
          name: cm-srv-rds-01-rdp
      - name: winrm-config
        configMap:
          name: cm-srv-rds-01-winrm
---
apiVersion: v1
kind: Service
metadata:
  name: srv-rds-01
  namespace: aisecops
spec:
  selector:
    app: srv-rds-01
  ports:
  - name: rdp
    port: 3389
    targetPort: 3389
  - name: winrm-https
    port: 5986
    targetPort: 5986
