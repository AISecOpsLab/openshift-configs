apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aisecops
  namespace: argocd
  labels:
    managed-by: aisecops-agent
spec:
  project: default

  source:
    repoURL: https://github.com/AISecOpsLab/openshift-configs.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      exclude: "argocd/**"

  destination:
    server: https://kubernetes.default.svc
    namespace: aisecops
    
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from"

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
