apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aisecops
  namespace: argocd
  labels:
    managed-by: aisecops-agent
spec:
  project: default

  source:
    repoURL: https://github.com/AISecOpsLab/openshift-configs.git
    targetRevision: main
    path: .
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: aisecops

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
