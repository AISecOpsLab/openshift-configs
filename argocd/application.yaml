apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aisecops
  namespace: argocd
  labels:
    managed-by: aisecops-agent
spec:
  project: default

  source:
    # Remplacer par l'URL du dépôt GitHub openshift-configs
    repoURL: https://github.com/VOTRE_ORG/openshift-configs.git
    targetRevision: main
    # ArgoCD lit tous les manifests depuis la racine du dépôt
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: aisecops

  syncPolicy:
    # Sync MANUEL uniquement — l'humain valide et merge la PR, puis déclenche la sync
    # Ne pas activer automated.selfHeal en production sans validation HITL
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
