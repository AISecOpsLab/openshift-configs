apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # Added general request rate limiting to mitigate HTTP scanning attempts
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;
    
    server {
        listen 80;
        server_name srv-web-01;

        # Existing rate limiting for login attempts
        limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

        # Enhanced protection against SQL injection, XSS, and common injection patterns in query strings
        if ($query_string ~* "(union\s+select|<script>|or\s+'.+?'\s*=\s*'.+?')") {
            return 403;
        }

        location / {
            # Apply general request limiting
            limit_req zone=general burst=10 nodelay;
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://localhost:8080;
        }
    }
