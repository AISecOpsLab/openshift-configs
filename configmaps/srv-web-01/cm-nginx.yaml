apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    server {
        listen 80;
        server_name srv-web-01;

        # Rate limiting to mitigate brute-force login attempts
        # Adjusted lower rate and burst to tighten protection for login endpoint
        limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

        # Basic protection against SQL injection and XSS attempts in query strings
        if ($query_string ~* "(union\s+select|<script>)") {
            return 403;
        }

        location / {
            # Apply stricter rate limiting for login attempts
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://localhost:8080;
        }
    }
