apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=10r/s;

    server {
        listen 80;
        server_name srv-web-01;

        server_tokens off;
        autoindex off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
        # Block null byte injection attempts
        if ($request_uri ~ "%00") { return 444; }
        # Block directory traversal attempts (../)
        if ($request_uri ~ "\./") { return 403; }
        # Limit requests from known scanners
        limit_req zone=scan_zone burst=20 nodelay;
    }