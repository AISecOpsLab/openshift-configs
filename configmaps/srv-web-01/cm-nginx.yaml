apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
# Remédiation à l'attaque de scan détectée par Wazuh (T1595.002)
# IP source bloquée : 172.19.131.174
# Source confidentielle : vérifiée dans CMDB, non incluse dans trusted_sources

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    server_name srv-web-01;

    server_tokens off;  # Réduction de surface, info non divulguée
    autoindex off;      # Supression de l'index public

    root /usr/share/nginx/html;
    index index.html;

    # Bloquer l'IP source de scan
    deny 172.19.131.174;

    # Limiter les requêtes par IP
    limit_req zone=perip burst=20 nodelay;

    # Fermer les chemins sensibles
    location ~ ^/admin {
        return 444;
    }
    location ~ ^/.bash_history {
        return 444;
    }
    location ~ ^/.git {
        return 444;
    }
    location ~ ^/wp-login {
        return 444;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

