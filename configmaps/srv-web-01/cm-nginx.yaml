apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;
        server_tokens on;
        autoindex on;

        root /usr/share/nginx/html;
        index index.html;

        # Block suspicious scanning traffic from known aggressor
        deny 172.19.131.174;

        location / {
            try_files $uri $uri/ =404;
        }
    }
