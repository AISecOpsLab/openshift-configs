apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    # Security: Block malicious scanner IP
    deny 172.19.131.174;

    # Global HTTP settings
    server_tokens on;
    autoindex on;

    # Default server block
    server {
        listen 80;
        server_name srv-web-01;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
