apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;

        server_tokens off;
        autoindex off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
       
        # Block attacker's IP
        deny 172.18.0.3;
    
        # Block null byte injection attempts and setup rate limiting
        if ($request_uri ~ "%00") { return 444; }     
        limit_req_zone $binary_remote_addr zone=web_security:10m rate=5r/s;
    }
