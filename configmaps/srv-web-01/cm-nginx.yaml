apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;

        # Rate limiting to mitigate scanning / brute request bursts
        limit_req_zone $binary_remote_addr zone=scan:10m rate=10r/s;
        limit_req zone=scan burst=20 nodelay;

        server_tokens off;  # disabled to reduce information leakage
        autoindex off;      # disabled directory listing

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
