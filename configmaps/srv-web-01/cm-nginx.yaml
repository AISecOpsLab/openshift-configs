apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    http {
        limit_req_zone $binary_remote_addr zone=one:10m rate=20r/s;
    }
    server {
        listen 80;
        server_name srv-web-01;

        server_tokens off;
        autoindex off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            limit_req zone=one burst=30 nodelay;
            try_files $uri $uri/ =404;
        }
        # Block null byte injection attempts
        if ($request_uri ~ "%00") { return 444; }
        # Block source IP 172.18.0.3
        if ($remote_addr = 172.18.0.3) { return 444; }
    }