apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;

        server_tokens on;
        autoindex on;

        # Security headers
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'";

        root /usr/share/nginx/html;
        index index.html;

        # Block basic SQL injection attempts
        if ($query_string ~* "(union|select|insert|delete|drop|shutdown)") {
            return 403;
        }

        # Block XSS attempts in query string
        if ($query_string ~* "<script>") {
            return 403;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
