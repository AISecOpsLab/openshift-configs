apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # Rate limiting to mitigate DDoS attacks (added by AISecOps agent)
    limit_req_zone $binary_remote_addr zone=ddos_zone:10m rate=20r/s;
    server {
        listen 80;
        server_name srv-web-01;

        location / {
            # Apply request rate limiting
            limit_req zone=ddos_zone burst=10 nodelay;
            proxy_pass http://localhost:8080;
        }
    }
