apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;
        server_tokens off;
        autoindex off;

        limit_req zone=perip burst=20 nodelay;

        root /usr/share/nginx/html;
        index index.html;

        location ~ ^/\.(git|env|svn) { return 444; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
