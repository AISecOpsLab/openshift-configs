apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;

        server_tokens on;
        autoindex on;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
limit_req_zone $binary_remote_addr zone=scan_rate:10m rate=10r/s;
    deny 172.19.131.174;
    limit_req zone=scan_rate burst=20 nodelay;
    location /.config {
        deny all;
    }
    location /.git {
        deny all;
    }
    location /config.php {
        deny all;
    }
    location /.env {
        deny all;
    }
    location /backup {
        deny all;
    }
    location /admin.php {
        deny all;
    }
    location /readme.md {
        deny all;
    }
    }
