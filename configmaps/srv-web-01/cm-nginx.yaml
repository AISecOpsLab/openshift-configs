apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    # Rate limit zone for scan mitigation
    limit_req_zone $binary_remote_addr zone=scan:10m rate=5r/s;
    server {
        listen 80;
        # Apply rate limiting to mitigate scanning
        limit_req zone=scan burst=20 nodelay;
        deny 172.18.0.3;
        server_name srv-web-01;

        server_tokens off;
        autoindex off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
        # Block null byte injection attempts
        if ($request_uri ~ "\%00") { return 444; }
        # Block path traversal attempts
        if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e|%252e)") { return 444; }
    }
