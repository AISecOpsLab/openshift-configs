apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    # Rate limiting for reconnaissance scans (T1595.002)
    limit_req_zone $binary_remote_addr zone=scan:10m rate=1r/s;

    server {
        listen 80;
        server_name srv-web-01;

        server_tokens on;
        autoindex on;

        root /usr/share/nginx/html;
        index index.html;

        # Limit repeated 404s and scans from same IP
        limit_req zone=scan burst=5 nodelay;

        location / {
            try_files $uri $uri/ =404;
        }
    }
