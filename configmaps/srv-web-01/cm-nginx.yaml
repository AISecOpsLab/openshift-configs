apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;

        server_tokens off;
        autoindex off;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
        # Block null byte injection attempts
        if ($request_uri ~ "%00") { return 444; }
        # Block path traversal attempts
        if ($request_uri ~* "(\.\./|\.\.\\|%2e%2e|%252e)") { return 444; }
        # Block attacker IP identified by Wazuh scan activity
        deny 172.18.0.3;
    }