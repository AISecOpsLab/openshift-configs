apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx (corrigé)
    # Contre-mesures contre les scans web (MITRE T1595.002)
    # - Source IP bloquée : 172.19.131.174
    # - Chemins sensibles bloqués : /admin, /phpmyadmin, /.config, /git, /env, /svn
    # - Limitation du débit (10r/s) avec délai

    # Zone de limitation du débit par IP
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

    server {
        listen 80;
        server_name srv-web-01;

        # Réduction de l'information divulguée
        server_tokens off;
        autoindex off;

        root /usr/share/nginx/html;
        index index.html;

        # Blocage de l'IP source du scan
        deny 172.19.131.174;

        # Limitation du débit pour cette IP
        limit_req zone=perip burst=20 nodelay;

        # Fermeture des chemins vulnérables
        location ~ ^/\.(git|env|svn) { return 444; }
        location ~ ^/(wp-admin|wp-login|phpmyadmin) { return 444; }
        location ~ ^/\.config { return 444; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
