apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  nginx.conf: |
  location ~ ^/\.(git|env|svn) { return 444; }
    # srv-web-01 — nginx
    server {
        listen 80;
        server_name srv-web-01;
        server_tokens on;
        autoindex on;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
