apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    http {
        # Prevent version exposure
        server_tokens off;

        # Block scan source IP
        deny 172.19.131.174;

        # Rate limit for scan attacks
        limit_req_zone $binary_remote_addr zone=scan:50m rate=10r/m;
    }

    server {
        listen 80;
        server_name srv-web-01;

        # Rate limit scans
        limit_req zone=scan burst=5 nodelay;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
