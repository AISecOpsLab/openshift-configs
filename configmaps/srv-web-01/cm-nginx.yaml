apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    # Rate limiting and IP blocking for security
    # Block and rate limit scan attempts from 172.19.131.174
    # See: Wazuh rule 31151, MITRE T1595.002 (Reconnaissance)

    limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=1r/s;

    http {
        # Deny known scanner IPs to prevent further scanning
        deny 172.19.131.174;

        # Rate limit requests from any source to prevent flooding
        limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

        # Include site-specific server configs
        include /etc/nginx/conf.d/*.conf;

        # Use the rate limit zone for requests
        server {
            listen 80;
            server_name srv-web-01;

            server_tokens on;
            autoindex on;

            root /usr/share/nginx/html;
            index index.html;

            location / {
                try_files $uri $uri/ =404;
            }
        }
    }
