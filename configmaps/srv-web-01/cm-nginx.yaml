apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    server {
        listen 80;
        server_name srv-web-01;
        deny 198.51.100.20;

        # Block common SQLi/XSS patterns in query strings
        if ($query_string ~* "(union|select|<script>)") {
            return 403;
        }

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Content-Security-Policy "default-src 'self';";

        location / {
            proxy_pass http://localhost:8080;
        }
    }
