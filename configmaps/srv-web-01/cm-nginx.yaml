# srv-web-01 — nginx
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    server_name srv-web-01;

    server_tokens on;
    autoindex on;

    root /usr/share/nginx/html;
    index index.html;

    # Block the scan source IP
    deny 172.19.131.174;

    # Rate limit requests from the same IP
    limit_req zone=perip burst=20 nodelay;

    # Close sensitive paths that are commonly scanned
    location ~ ^/\.git { return 444; }
    location ~ ^/\.env { return 444; }
    location ~ ^/\.svn { return 444; }
    location ~ ^/(wp-admin|wp-login|phpmyadmin) { return 444; }

    location / {
        try_files $uri $uri/ =404;
    }
}