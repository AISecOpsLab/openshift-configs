apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    server {
        listen 80;
        server_name srv-web-01;

        location / {
            # Protection against SQL injection and XSS attempts in query parameters
            if ($args ~* "(union|select|<script>)") {
                return 403;
            }
            proxy_pass http://localhost:8080;
        }
    }
