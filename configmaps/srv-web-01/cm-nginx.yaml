
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    # Rate limiting for vulnerability scanning attempts
    limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=10r/s;

    server {
        listen 80;
        server_name srv-web-01;

        server_tokens on;
        autoindex on;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Limit requests to /sdk to prevent scanning
        location /sdk {
            limit_req zone=scan_zone burst=20 nodelay;
            try_files $uri $uri/ =404;
            allow all;
        }
    }
