apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    limit_req_zone $binary_remote_addr zone=scan:10m rate=10r/s;

    http {
        limit_req_zone $binary_remote_addr zone=scan:10m rate=10r/s;

        # Deny known scanner IP
        deny 172.19.131.174;

        server {
            listen 80;
            server_name srv-web-01;

            server_tokens off;  # Hide version
            autoindex off;      # Disable directory listing

            root /usr/share/nginx/html;
            index index.html;

            # Apply rate limiting to all requests
            limit_req zone=scan burst=20 nodelay;

            location / {
                try_files $uri $uri/ =404;
            }
        }
    }
