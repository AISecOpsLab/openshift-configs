apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # srv-web-01 — nginx
    # Rate limiting for scan protection
    limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=10r/s;

    # Define the rate limit for scan-like requests
    http {
        # Limit requests to prevent automated scanning
        limit_req_zone $binary_remote_addr zone=scan_zone:10m rate=10r/s;

        server {
            listen 80;
            server_name srv-web-01;

            server_tokens on;
            autoindex on;

            root /usr/share/nginx/html;
            index index.html;

            # Block known scan paths
            location ~* (/\.cvsignore|/\.git|/\.svn|/admin|/backup|/config\.ini|/web\.config|/phpmyadmin|/wp-admin|/README\.txt|/LICENSE) {
                deny all;
            }

            location / {
                try_files $uri $uri/ =404;
            }

            # Use the rate limit zone for sensitive areas
            location ~* /\.(?i:cvsignore|git|svn|admin|backup|config\.ini|web\.config|phpmyadmin|wp-admin|README\.txt|LICENSE) {
                limit_req zone=scan_zone burst=20 nodelay;
                deny all;
            }
        }
    }
