apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    server {
        listen 80;
        server_name srv-web-01;

        # Rate limiting to mitigate brute-force login attempts
        limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
        # Rate limiting to mitigate HTTP scanning attempts
        limit_req_zone $binary_remote_addr zone=scan:10m rate=30r/m;  # added for scan mitigation

        # Basic protection against SQL injection and XSS attempts in query strings
        if ($query_string ~* "(union\s+select|<script>)") {
            return 403;
        }

        location / {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=scan burst=10 nodelay;  # added for scan mitigation
            proxy_pass http://localhost:8080;
        }
    }
