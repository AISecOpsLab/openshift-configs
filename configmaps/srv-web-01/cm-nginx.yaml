apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    limit_req_zone $binary_remote_addr zone=scan_limit:10m rate=5r/s;
    
    server {
        listen 80;
        server_name srv-web-01;

        # Protect against scanning
        limit_req zone=scan_limit burst=10 nodelay;

        location / {
            proxy_pass http://localhost:8080;
        }
    }
