apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-nginx
  namespace: aisecops
  labels:
    app: srv-web-01
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    server {
        listen 80;
        server_name srv-web-01;

        # Protection against SQL injection patterns in query parameters
        if ($args ~* "union.*select") {
            return 403;
        }
        # Protection against basic XSS attempts
        if ($request_uri ~* "<script>") {
            return 403;
        }
        # Protection against classic authentication bypass patterns
        if ($args ~* "or.*'1'='1") {
            return 403;
        }

        # Block brute-force source IP for admin login
        location = /admin/login {
            deny 203.0.113.10;
            proxy_pass http://localhost:8080;
        }

        location / {
            proxy_pass http://localhost:8080;
        }
    }
