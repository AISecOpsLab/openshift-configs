apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-sshd
  namespace: aisecops
  labels:
    app: srv-web-01
    service: sshd
    managed-by: aisecops-agent
data:
  sshd_config: |
    # sshd_config — srv-web-01
    # Ubuntu 24.04 LTS (Noble Numbat)
    # CMDB : cmdb/srv-web-01.md | Service : nginx-public-front

    # ─── Réseau ───────────────────────────────────────────────────────────────────
    Port 22
    AddressFamily any
    ListenAddress 0.0.0.0
    ListenAddress ::

    # ─── Authentification ─────────────────────────────────────────────────────────
    LoginGraceTime 120
    PermitRootLogin no
    StrictModes yes
    MaxAuthTries 1
    MaxSessions 10
    MaxStartups 10:30:100

    PubkeyAuthentication yes
    AuthorizedKeysFile .ssh/authorized_keys

    PasswordAuthentication no
    PermitEmptyPasswords no

    # Désactivé sur Ubuntu 24.04 (remplacé par PAM)
    KbdInteractiveAuthentication no

    # ─── PAM / environnement ──────────────────────────────────────────────────────
    UsePAM yes
    AcceptEnv LANG LC_*

    # ─── Fonctionnalités désactivées ──────────────────────────────────────────────
    X11Forwarding no
    PrintMotd no
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    PermitTunnel no

    # ─── Journalisation ───────────────────────────────────────────────────────────
    SyslogFacility AUTH
    LogLevel VERBOSE

    # ─── SFTP ─────────────────────────────────────────────────────────────────────
    Subsystem sftp /usr/lib/openssh/sftp-server
