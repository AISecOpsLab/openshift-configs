apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-01-sshd
  namespace: aisecops
  labels:
    app: srv-web-01
    service: sshd
    managed-by: aisecops-agent
data:
  sshd_config: |
    # Configuration pour le SSHD : durcissement
    # Ne pas modifier sans approbation d'audit
    # Durcissement : https://aisecops.local/docs/hardening/sshd
    # Règles par défaut pour les systèmes en production

    # Éviter la compromission par root
    PermitRootLogin no

    # Authentification par clés uniquement
    PasswordAuthentication no

    # Limiter les tentatives d'accès
    MaxAuthTries 4

    # Interdire les mots de passe vides
    PermitEmptyPasswords no

    # Désactiver la redirection X11
    X11Forwarding no
