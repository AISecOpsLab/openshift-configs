apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-02-nginx
  namespace: aisecops
  labels:
    app: srv-web-02
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    # Nginx configuration — srv-web-02
    # Rôle : reverse proxy avec load balancing vers srv-app-01 et srv-app-02
    # CMDB : cmdb/srv-web-02.md

    user www-data;
    worker_processes auto;
    pid /run/nginx.pid;
    error_log /var/log/nginx/error.log;
    include /etc/nginx/modules-enabled/*.conf;

    events {
        worker_connections 1024;
        multi_accept on;
    }

    http {
        ## Basic Settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;
        server_names_hash_bucket_size 64;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ## SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        ## Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        ## Gzip
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

        ## Rate limiting — protection brute-force et DDoS
        limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
        limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

        ## Upstream — load balancing round-robin vers les serveurs applicatifs
        upstream backend_api {
            least_conn;
            server 10.0.2.10:8080 max_fails=3 fail_timeout=30s;
            server 10.0.2.11:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        ## Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self';" always;

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name srv-web-02.example.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name srv-web-02.example.com;

        ssl_certificate     /etc/ssl/certs/srv-web-02.crt;
        ssl_certificate_key /etc/ssl/private/srv-web-02.key;
        ssl_trusted_certificate /etc/ssl/certs/srv-web-02-chain.pem;
        ssl_dhparam         /etc/ssl/certs/dhparam.pem;

        access_log /var/log/nginx/srv-web-02.access.log main;
        error_log  /var/log/nginx/srv-web-02.error.log warn;

        ## Limite de connexions simultanées par IP
        limit_conn conn_limit 20;

        location /api/ {
            limit_req zone=api burst=40 nodelay;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            proxy_next_upstream error timeout http_502 http_503;
        }

        location / {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
