apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-web-02-nginx
  namespace: aisecops
  labels:
    app: srv-web-02
    service: nginx
    managed-by: aisecops-agent
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /var/log/nginx/error.log;

    events {
        worker_connections 1024;
        multi_accept on;
    }

    http {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;
        server_names_hash_bucket_size 64;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # Limit repeated access from same IP
        limit_req_zone $binary_remote_addr zone=scan:10m rate=10r/m;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

        upstream backend_api {
            least_conn;
            server srv-app-01:8080 max_fails=3 fail_timeout=30s;
            server srv-app-02:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self';" always;

        server {
            listen 80;
            listen [::]:80;
            server_name srv-web-02.example.com _;

            # Block malicious scan probes
            location ~* ^/(probe|admin|debug|test|config|backup|sql|upload|cgi-bin|phpmyadmin|wordpress|wp-login|wp-content|wp-includes) {
                deny all;
            }

            # Apply rate limiting to scan-like patterns
            location /probe {
                limit_req zone=scan burst=20 nodelay;
                limit_req_status 429;
            }

            location /api/ {
                limit_req zone=api burst=40 nodelay;

                proxy_pass         http://backend_api;
                proxy_http_version 1.1;
                proxy_set_header   Connection "";
                proxy_set_header   Host              $host;
                proxy_set_header   X-Real-IP         $remote_addr;
                proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;

                proxy_connect_timeout 5s;
                proxy_send_timeout    30s;
                proxy_read_timeout    30s;

                proxy_next_upstream error timeout http_502 http_503;
            }

            location / {
                return 404;
            }

            location ~ \. {
                deny all;
            }
        }
    }