apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-proxy-01-haproxy
  namespace: aisecops
  labels:
    app: srv-proxy-01
    service: haproxy
    managed-by: aisecops-agent
data:
  haproxy.cfg: |
    # haproxy.cfg — srv-proxy-01
    # Rôle : reverse proxy / load balancer public en frontal du web tier
    # CMDB : cmdb/srv-proxy-01.md

    global
        log /dev/log local0
        maxconn 4096
        # Durcissement TLS
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

    defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        option  forwardfor
        timeout connect 5s
        timeout client  30s
        timeout server  30s

    # ─── Frontend public ────────────────────────────────────────────────
    frontend http_in
        bind *:80
        bind *:443 ssl crt /etc/haproxy/certs/aisecops.pem
        # Redirige tout le trafic clair vers HTTPS
        http-request redirect scheme https unless { ssl_fc }
        # Headers de sécurité
        http-response set-header Strict-Transport-Security "max-age=63072000"
        http-response set-header X-Frame-Options "SAMEORIGIN"
        http-response set-header X-Content-Type-Options "nosniff"
        default_backend web_tier

    # ─── Backend web tier ───────────────────────────────────────────────
    backend web_tier
        balance roundrobin
        option httpchk GET /health
        server srv-web-01 10.0.1.15:80 check
        server srv-web-02 10.0.1.16:80 check
