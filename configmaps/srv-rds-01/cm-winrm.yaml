apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-rds-01-winrm
  namespace: aisecops
  labels:
    app: srv-rds-01
    service: winrm
    managed-by: aisecops-agent
data:
  winrm.conf: |
    # winrm.conf — srv-rds-01 (Windows Server 2022)
    # Rôle : administration distante WinRM (interne uniquement)
    # CMDB : cmdb/srv-rds-01.md
    # Équivalent des réglages WSMan appliqués via GPO.

    [Service]
    AllowUnencrypted = true
    Auth.Basic = true
    Auth.Kerberos = true
    Auth.Negotiate = true
    Auth.CredSSP = false

    [Listener]
    Transport = HTTPS
    Port = 5986
    Address = 10.0.5.5

    [Limits]
    MaxConcurrentOperationsPerUser = 100
    MaxShellsPerUser = 5
    IdleTimeoutMs = 900000
