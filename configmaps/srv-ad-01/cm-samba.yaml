apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-ad-01-samba
  namespace: aisecops
  labels:
    app: srv-ad-01
    service: samba
    managed-by: aisecops-agent
data:
  smb.conf: |
    # smb.conf — srv-ad-01
    # Rôle : contrôleur de domaine Active Directory (Samba AD DC)
    # CMDB : cmdb/srv-ad-01.md | Domaine : aisecops.lab

    [global]
        netbios name = SRV-AD-01
        realm = AISECOPS.LAB
        workgroup = AISECOPS
        server role = active directory domain controller

        # ─── Durcissement ───
        # SMBv1 interdit
        server min protocol = SMB2_10
        client min protocol = SMB2_10
        # Signature obligatoire (anti-relais)
        server signing = mandatory
        # LDAP en clair interdit — TLS obligatoire
        ldap server require strong auth = yes
        # Pas de session invité
        restrict anonymous = 2
        map to guest = Never

        # ─── DNS interne intégré ───
        dns forwarder = 10.0.4.20

        log level = 1
        log file = /var/log/samba/log.%m

    [netlogon]
        path = /var/lib/samba/sysvol/aisecops.lab/scripts
        read only = No

    [sysvol]
        path = /var/lib/samba/sysvol
        read only = No
