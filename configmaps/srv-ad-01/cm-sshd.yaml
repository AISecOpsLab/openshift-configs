apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-ad-01-sshd
  namespace: aisecops
  labels:
    app: srv-ad-01
    service: sshd
    managed-by: aisecops-agent
data:
  sshd_config: |
    # sshd_config — srv-ad-01
    # Debian 12 (Bookworm)
    # CMDB : cmdb/srv-ad-01.md | Service : samba-ad-dc (domaine aisecops.lab)

    Port 22
    AddressFamily any
    ListenAddress 10.0.4.10

    LoginGraceTime 60
    PermitRootLogin no
    StrictModes yes
    MaxAuthTries 4
    MaxSessions 5
    MaxStartups 10:30:60

    PubkeyAuthentication yes
    AuthorizedKeysFile .ssh/authorized_keys

    PasswordAuthentication no
    PermitEmptyPasswords no
    KbdInteractiveAuthentication no

    AllowGroups identity-admins

    UsePAM yes
    AcceptEnv LANG LC_*

    X11Forwarding no
    PrintMotd no
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    PermitTunnel no

    SyslogFacility AUTH
    LogLevel VERBOSE

    Subsystem sftp /usr/lib/openssh/sftp-server
