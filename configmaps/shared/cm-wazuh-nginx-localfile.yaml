apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-wazuh-nginx-localfile
  namespace: aisecops
  labels:
    app: aisecops
    service: wazuh-agent
data:
  10-aisecops-nginx-localfile.sh: |
    #!/bin/sh
    OSSEC_CONF=/var/ossec/etc/ossec.conf
    LOG=/var/log/nginx/access.log
    if ! grep -q "$LOG" "$OSSEC_CONF" 2>/dev/null; then
      cat >> "$OSSEC_CONF" <<EOF
    <ossec_config>
      <localfile>
        <log_format>apache</log_format>
        <location>$LOG</location>
      </localfile>
    </ossec_config>
    EOF
    fi
