apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-app-01-apache
  namespace: aisecops
  labels:
    app: srv-app-01
    service: apache
    managed-by: aisecops-agent
data:
  api-backend.conf: |
    # Apache2 configuration — srv-app-01
    # Rôle : serveur applicatif backend — API REST (instance principale)
    # Écoute sur 10.0.2.10:8080, accessible depuis web tier uniquement
    # CMDB : cmdb/srv-app-01.md

    # -----------------------------
    # /etc/apache2/ports.conf
    # -----------------------------
    Listen 10.0.2.10:8080

    # -----------------------------
    # /etc/apache2/conf-enabled/security.conf
    # -----------------------------
    ServerTokens Prod
    ServerSignature Off
    TraceEnable Off

    <LimitExcept GET POST PUT DELETE OPTIONS>
        Require all denied
    </LimitExcept>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "1; mode=block"

    # -----------------------------
    # /etc/apache2/sites-enabled/api-backend.conf
    # -----------------------------
    <VirtualHost 10.0.2.10:8080>
        ServerName srv-app-01.internal

        DocumentRoot /var/www/api

        ErrorLog  /var/log/apache2/srv-app-01.error.log
        CustomLog /var/log/apache2/srv-app-01.access.log combined

        <Directory /var/www/api>
            Options -Indexes -FollowSymLinks -MultiViews
            AllowOverride None
            Require ip 10.0.1.0/24
        </Directory>

        <Location /health>
            Require ip 10.0.1.0/24
            SetHandler server-status
        </Location>

        ProxyPreserveHost On
        ProxyPass        /api/ http://127.0.0.1:9000/api/
        ProxyPassReverse /api/ http://127.0.0.1:9000/api/

        ProxyTimeout 30
        Timeout 30

    </VirtualHost>
