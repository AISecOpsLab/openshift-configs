apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-mail-01-sshd
  namespace: aisecops
  labels:
    app: srv-mail-01
    service: sshd
    managed-by: aisecops-agent
data:
  sshd_config: |
    # sshd_config — srv-mail-01
    # Debian 12 (Bookworm)
    # CMDB : cmdb/srv-mail-01.md | Service : postfix-dovecot

    Port 22
    AddressFamily any
    ListenAddress 10.0.4.30

    LoginGraceTime 120
    PermitRootLogin no
    StrictModes yes
    MaxAuthTries 6
    MaxSessions 10
    MaxStartups 10:30:100

    PubkeyAuthentication yes
    AuthorizedKeysFile .ssh/authorized_keys

    PasswordAuthentication no
    PermitEmptyPasswords no
    KbdInteractiveAuthentication no

    UsePAM yes
    AcceptEnv LANG LC_*

    X11Forwarding no
    PrintMotd no
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    PermitTunnel no

    SyslogFacility AUTH
    LogLevel VERBOSE

    Subsystem sftp /usr/lib/openssh/sftp-server
