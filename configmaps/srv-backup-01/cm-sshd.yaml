apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-srv-backup-01-sshd
  namespace: aisecops
  labels:
    app: srv-backup-01
    service: sshd
    managed-by: aisecops-agent
data:
  sshd_config: |
    # sshd_config — srv-backup-01
    # Ubuntu 24.04 LTS (Noble Numbat)
    # CMDB : cmdb/srv-backup-01.md | Service : restic-backup

    Port 22
    AddressFamily any
    ListenAddress 10.0.5.20

    LoginGraceTime 60
    PermitRootLogin no
    StrictModes yes
    MaxAuthTries 3
    MaxSessions 4
    MaxStartups 5:30:30

    PubkeyAuthentication yes
    AuthorizedKeysFile .ssh/authorized_keys

    PasswordAuthentication no
    PermitEmptyPasswords no
    KbdInteractiveAuthentication no

    AllowUsers backup@10.0.0.5

    UsePAM yes
    AcceptEnv LANG LC_*

    X11Forwarding no
    PrintMotd no
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    PermitTunnel no

    SyslogFacility AUTH
    LogLevel VERBOSE

    Subsystem sftp /usr/lib/openssh/sftp-server
