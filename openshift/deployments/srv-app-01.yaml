apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-app-01
  namespace: aisecops
  labels:
    app: srv-app-01
    role: app_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-app-01
  template:
    metadata:
      labels:
        app: srv-app-01
    spec:
      containers:
      - name: apache
        image: httpd:2.4
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: apache-config
          mountPath: /usr/local/apache2/conf/extra/api-backend.conf
          subPath: api-backend.conf
      volumes:
      - name: apache-config
        configMap:
          name: cm-srv-app-01-apache
---
apiVersion: v1
kind: Service
metadata:
  name: srv-app-01
  namespace: aisecops
spec:
  selector:
    app: srv-app-01
  ports:
  - name: api
    port: 8080
    targetPort: 8080
