apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-web-01
  namespace: aisecops
  labels:
    app: srv-web-01
    role: web_server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-web-01
  template:
    metadata:
      labels:
        app: srv-web-01
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: cm-srv-web-01-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: srv-web-01
  namespace: aisecops
spec:
  selector:
    app: srv-web-01
  ports:
  - name: http
    port: 80
    targetPort: 80
