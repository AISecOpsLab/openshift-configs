apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-web-02
  namespace: aisecops
  labels:
    app: srv-web-02
    role: reverse_proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-web-02
  template:
    metadata:
      labels:
        app: srv-web-02
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: cm-srv-web-02-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: srv-web-02
  namespace: aisecops
spec:
  selector:
    app: srv-web-02
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
