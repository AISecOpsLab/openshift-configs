apiVersion: apps/v1
kind: Deployment
metadata:
  name: srv-db-01
  namespace: aisecops
  labels:
    app: srv-db-01
    role: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srv-db-01
  template:
    metadata:
      labels:
        app: srv-db-01
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          value: changeme
        - name: POSTGRES_DB
          value: appdb
---
apiVersion: v1
kind: Service
metadata:
  name: srv-db-01
  namespace: aisecops
spec:
  selector:
    app: srv-db-01
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
